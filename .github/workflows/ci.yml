name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ois_ci
      - run: pnpm db:validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ois_ci
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ois_ci
          AUTH_SECRET: ci-only-32-byte-minimum-secret-value
          AUTH_URL: http://localhost:3000
