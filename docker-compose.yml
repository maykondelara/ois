services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: ois_local
      POSTGRES_USER: ois_local_migrator
      POSTGRES_PASSWORD: change-me-local-only
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      {
        test: ["CMD-SHELL", "pg_isready -U ois_local_migrator -d ois_local"],
        interval: 5s,
        timeout: 3s,
        retries: 20,
      }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20 }
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment: { MINIO_ROOT_USER: ois_local_minio, MINIO_ROOT_PASSWORD: change-me-local-only }
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
volumes: { postgres_data: {}, redis_data: {}, minio_data: {} }
